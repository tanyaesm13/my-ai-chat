<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2e88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumi">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #000000; color: #fff; display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 16px; text-align: center; background: #000000; border-bottom: 3px solid #ff2e88; }
    header h1 { margin: 0; font-size: 20px; color: #ff4da6; }
    header p { margin: 4px 0 0; opacity: 0.85; font-size: 14px; }
    #lumiAvatar { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #ff2e88; object-fit: cover; animation: float 3s ease-in-out infinite; display: block; margin: 0 auto 8px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    #lumiAvatar.talking { animation: talkPulse 0.6s ease-in-out infinite; box-shadow: 0 0 18px #ff2e88; }
    @keyframes talkPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    #voiceToggle { background: none; border: 1px solid #ff2e88; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; padding: 0; margin-top: 8px; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #000000; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #ff2e88; color: #fff; }
    .ai { align-self: flex-start; background: #1a1a1a; border: 1px solid #ff2e88; }
    .error { align-self: center; background: #7f1d1d; font-size: 13px; }
    #form { display: flex; gap: 8px; padding: 12px; background: #000000; border-top: 2px solid #ff2e88; }
    #input { flex: 1; padding: 12px; border-radius: 24px; border: 1px solid #ff2e88; background: #111111; color: #fff; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 24px; border: none; background: #ff2e88; color: #fff; font-size: 16px; cursor: pointer; }
      button:disabled { opacity: 0.6; }
    #micBtn { padding: 12px 14px; border-radius: 50%; border: none; background: #ff2e88; color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; }
    #micBtn.listening { background: #ff4da6; box-shadow: 0 0 12px #ff2e88; }
    #contact { text-align: center; padding: 8px; font-size: 13px; background: #000000; }
    #contact a { color: #ff4da6; }
</style>
</head>
<body>
<header>
    <img id="lumiAvatar" src="lumi-avatar.webp" alt="Lumi">
    <h1>Lumi</h1>
    <p>Ask me anything</p>
    <button id="voiceToggle" title="Toggle voice">🔊</button>
</header>
<div id="chat">
    <div class="msg ai">Hi! I'm Lumi. What would you like to talk about?</div>
</div>
<form id="form">
    <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
    <button id="micBtn" type="button" title="Talk instead of typing">🎤</button>
    <button id="send" type="submit">Send</button>
</form>
<div id="contact"><a href="#" id="contactBtn">Contact</a></div>
<script>
  // STEP 5: Replace this with your real Cloudflare Worker URL after you deploy it in Step 3.
  // Example: const WORKER_URL = "https://my-ai-chat.your-name.workers.dev";
  const WORKER_URL = "https://lumi-chat.tanyaelizabethsm.workers.dev/";
  // STEP 6 (optional): Replace this with your Make.com webhook URL if you add the contact button.
  const CONTACT_WEBHOOK_URL = "PASTE_YOUR_MAKE_WEBHOOK_URL_HERE";
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let history = [];
  try { history = JSON.parse(localStorage.getItem('lumi_history') || '[]'); } catch (e) { history = []; }
  history = history.filter(m => m && typeof m.content === 'string' && (m.role === 'user' || m.role === 'assistant')).slice(-40);
  // Lumi voice: read replies aloud with the browser's built-in speech synthesis.
  let voiceOn = true;
  const voiceToggle = document.getElementById('voiceToggle');
  const lumiAvatar = document.getElementById('lumiAvatar');
  let lumiVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    if (!voices.length) return;
    lumiVoice =
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en') && /female|zira|samantha|google uk english female/i.test(v.name)) ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
      null;
  }
  pickVoice();
  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (lumiVoice) utter.voice = lumiVoice;
    utter.rate = 1;
    utter.pitch = 1.1;
    utter.onstart = () => { if (lumiAvatar) lumiAvatar.classList.add('talking'); };
    const stopTalking = () => { if (lumiAvatar) lumiAvatar.classList.remove('talking'); };
    utter.onend = stopTalking;
    utter.onerror = stopTalking;
    speechSynthesis.speak(utter);
  }
  voiceToggle.addEventListener('click', () => {
    voiceOn = !voiceOn;
    voiceToggle.textContent = voiceOn ? '🔊' : '🔇';
    if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  });
  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;
    if (WORKER_URL === "PASTE_YOUR_WORKER_URL_HERE") {
      addMsg("Your chat page is ready, but the Worker URL is not connected yet (Step 5). Paste your Cloudflare Worker URL into WORKER_URL in index.html, then re-upload to GitHub.", 'error');
      sendBtn.disabled = false;
      return;
    }
    const thinking = addMsg("Thinking...", 'ai');
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      const reply = data.reply || data.error || "Sorry, I didn't get a reply.";
      thinking.textContent = reply;
      history.push({ role: 'assistant', content: reply });
      try { localStorage.setItem('lumi_history', JSON.stringify(history.slice(-40))); } catch (e) {}
      speak(reply);
    } catch (err) {
      thinking.textContent = "Sorry, I couldn't reach the Worker. Check your Worker URL and that the Worker is deployed.";
    }
    sendBtn.disabled = false;
  });
  document.getElementById('contactBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    if (CONTACT_WEBHOOK_URL === "PASTE_YOUR_MAKE_WEBHOOK_URL_HERE") {
      alert("Contact button is not connected yet (Step 6, optional). Add your Make.com webhook URL to set it up.");
      return;
    }
    const email = prompt("What email should we reply to?");
    const msg = prompt("What would you like to say?");
    if (email && msg) {
      await fetch(CONTACT_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, message: msg }) });
      alert("Sent! Thank you.");
    }
  });
  // Voice input: talk instead of typing, using the browser's built-in SpeechRecognition.
  (function () {
    const micBtn = document.getElementById('micBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      micBtn.style.display = 'none';
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let listening = false;
    micBtn.addEventListener('click', () => {
      if (listening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });
    recognition.addEventListener('start', () => {
      listening = true;
      micBtn.classList.add('listening');
    });
    recognition.addEventListener('result', (e) => {
      const input = document.getElementById('input');
      input.value = e.results[0][0].transcript;
    });
    const stopListening = () => {
      listening = false;
      micBtn.classList.remove('listening');
    };
    recognition.addEventListener('end', stopListening);
    recognition.addEventListener('error', (e) => {
      stopListening();
      if (e.error === 'not-allowed') {
        addMsg('The browser blocked the microphone. You may need to allow microphone access for this site.', 'error');
      }
    });
  })();
</script>
</body>
</html>
